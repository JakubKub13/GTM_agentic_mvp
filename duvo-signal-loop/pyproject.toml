[project]
name = "duvo-signal-loop"
version = "1.0.0"
description = "A team of tool-using AI agents that turns a target list of retail/CPG accounts into rep-ready pipeline — scouting intent signals, scoring ICP fit, and routing accounts into your sales stack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jakub Kubala", email = "jakubkubala3@gmail.com" }
]
keywords = [
    "ai-agents",
    "intent-signals",
    "lead-scoring",
    "crm-integration",
    "async-first",
    "gtm-automation"
]

dependencies = [
    "anthropic>=0.40.0",
    "exa-py>=1.0.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/jakubkubala/duvo-signal-loop"
Documentation = "https://github.com/jakubkubala/duvo-signal-loop#readme"
Repository = "https://github.com/jakubkubala/duvo-signal-loop.git"

[tool.uv]
managed = true
dev-dependencies = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
# If using private packages or specific versions, add sources here

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["duvo"]
